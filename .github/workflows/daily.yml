name: Embedded SDK daily generate and GitHub Pages deploy
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', '.github/workflows/daily.yml']
  schedule:
    - cron: '0 9 * * *'  # Beijing 17:00; GitHub scheduling can be delayed
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: embedded-sdk-pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate daily practice when scheduled or manually started
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: |
          python -m pip install 'openai>=1.99,<3'
          python scripts/generate_daily.py
      - name: Validate the question archive
        run: python scripts/validate_data.py
      - name: Commit today's new practice
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/
          if ! git diff --cached --quiet; then
            git commit -m "content: new daily practice $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
